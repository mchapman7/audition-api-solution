spring:
  application:
    name: audition-api
  config:
    import: "optional:configserver:"
  # removed allow-bean-definition-overriding: true hides duplicate-bean mistakes
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  mvc:
    throw-exception-if-no-handler-found: true
# spring.sleuth.* is dead config. Sleuth was removed in Boot 3, and management.tracing.sampling already covers it
server:
  max-http-request-header-size: 16KB
audition:
  client:
    base-url: https://jsonplaceholder.typicode.com
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: '*' #TODO enable only info and health for security purposes. Consider that we may want to still access other actuator endpoints securely.
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"